<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16283a">
<title>Al-Ghuse Tailor — Designs</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---- Design tokens ---- */
:root{
  --navy:#16283a; --gold:#b98a2f; --gold-dark:#9a7425;
  --bg:#faf9f7; --card:#ffffff; --ink:#1c1c1c; --muted:#6b7280;
  --line:#e8e4de; --radius:14px; --pad:16px;
  --shadow:0 1px 3px rgba(22,40,58,.10),0 4px 14px rgba(22,40,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding-bottom:96px}
/* ---- Header ---- */
header{background:var(--navy);color:#fff;padding:20px var(--pad) 14px;
  position:sticky;top:0;z-index:20}
header h1{font-size:22px;font-weight:700;letter-spacing:.2px}
header p{font-size:13px;color:#c8d2dc;margin-top:2px}
.count{font-size:12px;color:#c8d2dc;margin-top:6px}
.offline-status{font-size:12px;color:#c8d2dc;margin-top:4px}
.offline-status.ready{color:#8fce9b}
.sync-status{font-size:11px;color:#8a97a3;margin-top:4px}
/* ---- Search ---- */
.search-wrap{padding:12px var(--pad) 4px;position:sticky;top:0;z-index:19;
  background:var(--bg)}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:0 12px;
  box-shadow:var(--shadow)}
.search-box svg{flex:0 0 auto;opacity:.55}
.search-box input{flex:1;border:0;outline:0;font-size:16px;padding:12px 0;
  background:transparent;color:var(--ink);min-width:0}
.search-box input::placeholder{color:#9aa0a6}
.clear-btn{border:0;background:transparent;font-size:20px;line-height:1;
  color:var(--muted);cursor:pointer;padding:6px;display:none}
/* ---- Grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px var(--pad) 0}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);
  display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.thumb{position:relative;aspect-ratio:3/4;background:#fff;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.video-badge{position:absolute;left:8px;bottom:8px;background:rgba(22,40,58,.85);
  color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
.card-name{padding:10px 10px 12px;font-size:13.5px;font-weight:600;line-height:1.35}
.card-name small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;
  font-size:15px}
/* ---- FAB ---- */
.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;
  background:var(--gold);color:#fff;border:0;font-size:32px;line-height:1;
  box-shadow:0 4px 16px rgba(185,138,47,.5);cursor:pointer;z-index:30;
  display:flex;align-items:center;justify-content:center}
.fab:active{background:var(--gold-dark)}
/* ---- Detail view ---- */
.detail{position:fixed;inset:0;background:#fff;z-index:50;display:none;
  flex-direction:column}
.detail.open{display:flex}
.detail-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--line);background:#fff}
.detail-bar h2{flex:1;font-size:16px;font-weight:700;line-height:1.3;min-width:0}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;
  width:40px;height:40px;font-size:18px;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.detail-media{flex:1;min-height:0;background:#fff;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.detail-media img{max-width:100%;max-height:100%;object-fit:contain}
.detail-media video{max-width:100%;max-height:100%;background:#000}
.detail-foot{padding:12px 16px 20px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted)}
.name-edit{display:flex;gap:8px;margin-top:10px}
.name-edit input{flex:1;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:15px;outline:0;min-width:0}
.name-edit button{border:0;border-radius:10px;background:var(--navy);color:#fff;
  padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn-danger{background:#b42318;color:#fff}
.btn-danger-outline{background:#fff;border:1px solid #eec5bf;color:#b42318;width:100%;margin-top:12px}
.delete-confirm{margin-top:12px;border:1px solid #f0d4d0;background:#fdf6f5;
  border-radius:12px;padding:12px}
.delete-confirm p{font-size:14px;font-weight:600;color:#7a271a}
/* ---- Add sheet ---- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;
  display:none;align-items:flex-end;justify-content:center}
.sheet-backdrop.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;
  overflow-y:auto}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet p.hint{font-size:13px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-size:15px;outline:0}
.field input[type=file]{width:100%;font-size:14px}
.preview{margin-top:10px;border-radius:12px;overflow:hidden;display:none}
.preview img,.preview video{width:100%;max-height:280px;object-fit:contain;
  background:#f3f1ee;display:block}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;
  font-weight:600;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
.btn-ghost{background:#f1efec;border:1px solid var(--line);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 18px;border-radius:24px;
  font-size:14px;z-index:70;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Al-Ghuse Tailor</h1>
    <p>Designs Collection</p>
    <div class="count" id="count"></div>
    <div class="offline-status" id="offlineStatus">Checking offline status…</div>
    <div class="sync-status" id="syncStatus">v10 • Sync: Connecting…</div>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16283a" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="search" type="search" placeholder="Search designs…" autocomplete="off" aria-label="Search designs">
      <button class="clear-btn" id="clearSearch" aria-label="Clear search">&times;</button>
    </div>
  </div>

  <main class="grid" id="grid"></main>
</div>

<button class="fab" id="fab" aria-label="Add design">+</button>

<!-- Detail view -->
<div class="detail" id="detail" role="dialog" aria-label="Design detail">
  <div class="detail-bar">
    <button class="icon-btn" id="detailClose" aria-label="Close">&larr;</button>
    <h2 id="detailName"></h2>
    <button class="icon-btn" id="editNameBtn" aria-label="Edit name">&#9998;</button>
  </div>
  <div class="detail-media" id="detailMedia"></div>
  <div class="detail-foot">
    <div id="detailTag"></div>
    <div class="name-edit" id="nameEdit" style="display:none">
      <input type="text" id="nameInput" aria-label="Design name">
      <button id="saveNameBtn">Save</button>
    </div>
    <button class="btn btn-danger-outline" id="deleteBtn">Delete Design</button>
    <div class="delete-confirm" id="deleteConfirm" style="display:none">
      <p>Delete this design?</p>
      <div class="sheet-actions" style="margin-top:10px">
        <button class="btn btn-ghost" id="cancelDelete">Cancel</button>
        <button class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Add design sheet -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" role="dialog" aria-label="Add design">
    <h2>Add Design</h2>
    <p class="hint">Pick a photo or video from your phone, give it a name, and save it. It stays on this phone and works offline.</p>
    <div class="field">
      <label for="fileInput">Photo / Video</label>
      <input type="file" id="fileInput" accept="image/*,video/*">
      <div class="preview" id="preview"></div>
    </div>
    <div class="field">
      <label for="designName">Design name</label>
      <input type="text" id="designName" placeholder="e.g. Grey Band-Collar Kurta" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelAdd">Cancel</button>
      <button class="btn btn-primary" id="saveAdd">Save Design</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   FIREBASE SYNC (Firestore + Anonymous Auth)
   ---------------------------------------------------------------------
   The app works fully offline on-device (localStorage + IndexedDB).
   Firebase adds cross-phone sync on top: renames, deletes and added
   designs are mirrored to Cloud Firestore, so a change on one phone
   appears on every phone that opens the same link.
   - Auth: Anonymous (signInAnonymously, persisted). The Firestore
     rules allow only authenticated access, so nothing syncs until
     sign-in succeeds.
   - Collections: overrides {name}, deleted {deletedAt},
     added {name, type, createdAt, imageData?, posterData?,
     videoLocalOnly?}.
   - Firebase Storage is NOT enabled on this project (Spark plan needs
     Blaze/billing for Storage), so added media syncs WITHOUT Storage:
     photos as a downscaled JPEG data URL inside the doc, videos as a
     poster thumbnail only (the video file stays on the phone it was
     added from). See uploadAddedMedia() — that ONE function is where
     a real Storage upload slots in later.
   - If Firebase cannot be reached (offline / blocked), every write
     is queued locally and flushed when the connection returns, and
     the app keeps working from local state exactly as before.
   - v10: silent write failures fixed — a payload that cannot be
     built THROWS (the op stays queued instead of being dropped), an
     image load that hangs times out, queued writes retry every 30s,
     local changes that never synced are re-queued on load
     (reconcile), and the status line shows pending count + last
     sync error so a failure is never invisible again.
   ===================================================================== */
const FIREBASE_CONFIG = { apiKey:"AIzaSyCbT8irlz7BuQAEFWdbSJL9bYEoYCIh6xI", authDomain:"al-ghuse-tailor.firebaseapp.com", projectId:"al-ghuse-tailor", storageBucket:"al-ghuse-tailor.firebasestorage.app", messagingSenderId:"884157794234", appId:"1:884157794234:web:d9041c781172350f603f83" };
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

/* Remote (Firestore) state — merged over local state at render time.
   Firestore wins for renames; deletes are a union (a delete is a
   delete — there is no un-delete in the app). */
let fb = null;            // {app, auth, db, doc, collection, setDoc, deleteDoc, onSnapshot, serverTimestamp, signInAnonymously}
let fbReady = false;      // true once anonymous sign-in succeeded
let fbInitStarted = false;
let fbApp = null;
let listenersAttached = false;
let listenerRetryTimer = null;
let fbOverrides = {};     // design id -> name
let fbDeleted = new Set();// design ids deleted on any phone
let fbAdded = {};         // design id -> {name, type, imageData, posterData, videoLocalOnly}
let syncedAdded = loadSyncedAdded(); // local added ids whose doc reached Firestore
let flushing = false;
let fbSnapshotsLoaded = {overrides:false, deleted:false, added:false}; // set by each onSnapshot's first fire

const LS_PENDING = "alghuse_pending_ops";   // [{kind,id,name?,type?}] — Firestore writes waiting for a connection
const LS_SYNCED_ADDED = "alghuse_synced_added"; // [id] — added designs already stored in Firestore

/* ---- Pending ops (offline write queue) ---- */
function loadPending(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_PENDING)||"[]");
    if(!Array.isArray(raw)) return [];
    return raw.filter(o=>o && typeof o.kind==="string" && typeof o.id==="string");
  }catch(e){ return []; }
}
function savePending(p){ try{ localStorage.setItem(LS_PENDING, JSON.stringify(p)); }catch(e){} }
function slimOp(op){
  const o = {kind:op.kind, id:op.id};
  if(op.name!==undefined) o.name = op.name;
  if(op.type!==undefined) o.type = op.type;
  return o;
}
function queueOp(op){
  const ops = loadPending().filter(o=>!(o.kind===op.kind && o.id===op.id));
  ops.push(slimOp(op));
  savePending(ops);
  updateSyncStatus();
}
function dropPendingOp(kind, id){
  savePending(loadPending().filter(o=>!(o.kind===kind && o.id===id)));
  updateSyncStatus();
}
function loadSyncedAdded(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_SYNCED_ADDED)||"[]");
    return new Set(Array.isArray(raw) ? raw.filter(x=>typeof x==="string") : []);
  }catch(e){ return new Set(); }
}
function saveSyncedAdded(){ try{ localStorage.setItem(LS_SYNCED_ADDED, JSON.stringify([...syncedAdded])); }catch(e){} }

/* ---- Added-media sync payload (Storage-ready slot) ---- */
function loadImageFromBlob(blob){
  /* A hung image load used to await forever: the add op was never
     queued and never written, with no error anywhere. 15s is plenty
     for a local blob; after that the caller treats it as a failure
     and the op stays queued for retry instead. */
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(blob);
    const img = new Image();
    let done = false;
    const timer = setTimeout(()=>{
      if(done) return; done = true;
      URL.revokeObjectURL(url);
      rej(new Error("image load timed out"));
    }, 15000);
    img.onload = ()=>{ if(done) return; done = true; clearTimeout(timer); URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ if(done) return; done = true; clearTimeout(timer); URL.revokeObjectURL(url); rej(new Error("image load failed")); };
    img.src = url;
  });
}
async function downscaleImageToDataUrl(blob, maxDim, quality){
  const img = await loadImageFromBlob(blob);
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", quality);
}
async function imageSyncDataUrl(blob){
  /* Firestore documents must stay under 1 MiB: try progressively
     smaller encodings until the data URL is safely below the limit. */
  const tries = [[800, 0.75], [640, 0.70], [480, 0.65]];
  for(const [dim, q] of tries){
    try{
      const url = await downscaleImageToDataUrl(blob, dim, q);
      if(url && url.length <= 700000) return url;
    }catch(e){ /* try the next smaller encoding instead of giving up */ }
  }
  return null;
}
function captureVideoPoster(blob){
  return new Promise((res)=>{
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto";
    let done = false;
    const finish = (out)=>{ if(done) return; done = true; clearTimeout(timer); URL.revokeObjectURL(url); res(out); };
    const timer = setTimeout(()=>finish(null), 10000);
    v.onloadedmetadata = ()=>{ try{ v.currentTime = Math.max(0, Math.min(0.5, (v.duration||1) * 0.25)); }catch(e){ finish(null); } };
    v.onseeked = ()=>{
      try{
        const scale = Math.min(1, 480 / Math.max(v.videoWidth||1, v.videoHeight||1));
        const w = Math.max(1, Math.round(v.videoWidth * scale));
        const h = Math.max(1, Math.round(v.videoHeight * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        finish(c.toDataURL("image/jpeg", 0.75));
      }catch(e){ finish(null); }
    };
    v.onerror = ()=>finish(null);
    v.src = url;
  });
}
/* TODO (Storage): when the Blaze plan is enabled, upload the original
   file here with uploadBytes(ref(storage, "added/" + id + "/" +
   file.name)) and return {storagePath, downloadUrl} (plus a small
   thumb for images). Callers spread this function's return value
   into the Firestore doc, so no other code needs to change. Until
   then: photos sync as a downscaled data URL, videos sync their
   poster only and stay local-only (videoLocalOnly). */
async function uploadAddedMedia(id, file, type){
  if(type === "image"){
    const imageData = await imageSyncDataUrl(file);
    return imageData ? {imageData} : {};
  }
  const posterData = await captureVideoPoster(file);
  const out = {videoLocalOnly: true};
  if(posterData) out.posterData = posterData;
  return out;
}

/* ---- Firestore writes (local-first: try now, queue on failure) ---- */
async function applyOp(op){
  const F = fb;
  if(!F) throw new Error("firebase not ready");
  if(op.kind === "rename"){
    await F.setDoc(F.doc(F.db, "overrides", op.id), {name: op.name}, {merge: true});
  }else if(op.kind === "delete"){
    await F.setDoc(F.doc(F.db, "deleted", op.id), {deletedAt: F.serverTimestamp()});
  }else if(op.kind === "deleteOverride"){
    await F.deleteDoc(F.doc(F.db, "overrides", op.id));
  }else if(op.kind === "deleteAdded"){
    await F.deleteDoc(F.doc(F.db, "added", op.id));
  }else if(op.kind === "add"){
    let payload = {};
    if(op.imageData || op.posterData){
      payload = {imageData: op.imageData, posterData: op.posterData, videoLocalOnly: op.videoLocalOnly};
    }else{
      const blob = await dbGet(op.id).catch(()=>null);
      /* A payload that cannot be built THROWS now: the op stays
         queued for retry instead of being silently dropped (the old
         code returned here, so flushPending deleted the op as if it
         had succeeded and the design never synced). */
      if(!blob) throw new Error("local media missing");
      try{ payload = await uploadAddedMedia(op.id, blob, op.type); }
      catch(e){ throw new Error("media prepare failed: " + shortErr(e)); }
      if(op.type === "image" && !payload.imageData) throw new Error("photo too large to sync");
    }
    const docData = {name: op.name, type: op.type, createdAt: F.serverTimestamp()};
    if(payload.imageData) docData.imageData = payload.imageData;
    if(payload.posterData) docData.posterData = payload.posterData;
    if(op.type === "video") docData.videoLocalOnly = true;
    await F.setDoc(F.doc(F.db, "added", op.id), docData);
    syncedAdded.add(op.id); saveSyncedAdded();
  }
}
async function fbWriteOrQueue(op){
  try{
    if(fbReady){ await applyOp(op); clearSyncError(); return; }
  }catch(e){ setSyncError(e); /* fall through to queue */ }
  queueOp(op);
}
async function flushPending(){
  if(!fbReady || flushing) return;
  flushing = true;
  try{
    /* One pass over a snapshot: a stuck op stays queued for retry
       but never blocks the ops behind it. */
    const ops = loadPending();
    let failed = false;
    for(const op of ops){
      try{
        await applyOp(op);
        dropPendingOp(op.kind, op.id);
      }catch(e){
        failed = true;
        setSyncError(e); // op stays in the queue — retried by the periodic flush
      }
    }
    if(!failed && !loadPending().length) clearSyncError();
    updateSyncStatus();
  }finally{ flushing = false; }
}
function syncRename(id, name){ fbWriteOrQueue({kind:"rename", id, name}); }
function syncDelete(id){ fbWriteOrQueue({kind:"delete", id}); }
function syncDeleteOverride(id){ fbWriteOrQueue({kind:"deleteOverride", id}); }
function syncDeleteAdded(id){
  dropPendingOp("add", id);
  syncedAdded.delete(id); saveSyncedAdded();
  fbWriteOrQueue({kind:"deleteAdded", id});
}
async function syncAddDesign(id, name, type, file){
  /* Every failure path ends with the op queued — an add can never
     vanish silently (a hung image load, a failed downscale, a
     Firestore error). The periodic flush + reconcile retry it. */
  try{
    let payload = {};
    try{ payload = await uploadAddedMedia(id, file, type); }catch(e){ payload = {}; }
    if(type === "image" && !payload.imageData){ queueOp({kind:"add", id, name, type}); updateSyncStatus(); return; }
    await fbWriteOrQueue({kind:"add", id, name, type, ...payload});
  }catch(e){
    queueOp({kind:"add", id, name, type});
    setSyncError(e);
  }
  updateSyncStatus();
}

/* ---- Firestore listeners (attach after anonymous sign-in) ---- */
function scheduleListenerRetry(){
  if(listenerRetryTimer) return;
  listenerRetryTimer = setTimeout(()=>{ listenerRetryTimer = null; listenersAttached = false; if(fbReady) attachListeners(); }, 30000);
}
function attachListeners(){
  if(listenersAttached || !fbReady) return;
  listenersAttached = true;
  const F = fb;
  const onErr = ()=>{ listenersAttached = false; scheduleListenerRetry(); };
  F.onSnapshot(F.collection(F.db, "overrides"), (snap)=>{
    const m = {};
    snap.forEach(d=>{ const v = d.data(); if(v && typeof v.name === "string") m[d.id] = v.name; });
    fbOverrides = m;
    fbSnapshotsLoaded.overrides = true;
    reconcileLocalWithServer();
    render();
  }, onErr);
  F.onSnapshot(F.collection(F.db, "deleted"), (snap)=>{
    const known = new Set(DESIGNS.map(d=>d.id));
    const s = new Set();
    snap.forEach(d=>{ if(known.has(d.id)) s.add(d.id); });
    fbDeleted = s;
    fbSnapshotsLoaded.deleted = true;
    reconcileLocalWithServer();
    render();
  }, onErr);
  F.onSnapshot(F.collection(F.db, "added"), (snap)=>{
    const m = {};
    snap.forEach(d=>{
      const v = d.data();
      if(!v) return;
      m[d.id] = {
        name: (typeof v.name === "string" ? v.name : "Untitled Design"),
        type: (v.type === "video" ? "video" : "image"),
        imageData: (typeof v.imageData === "string" ? v.imageData : null),
        posterData: (typeof v.posterData === "string" ? v.posterData : null),
        videoLocalOnly: !!v.videoLocalOnly
      };
    });
    fbAdded = m;
    fbSnapshotsLoaded.added = true;
    reconcileLocalWithServer();
    if(!snap.metadata.fromCache){
      /* Server state: a synced added design missing here was deleted
         on another phone — remove its local copy too. (Only from a
         server snapshot: a cache-only snapshot may legitimately lag.) */
      let changed = false;
      for(const id of [...syncedAdded]){
        if(!fbAdded[id]){
          syncedAdded.delete(id); changed = true;
          addedMeta = addedMeta.filter(a=>a.id!==id);
          if(addedUrls[id]){ URL.revokeObjectURL(addedUrls[id]); delete addedUrls[id]; }
          dbDelete(id).catch(()=>{});
        }
      }
      if(changed){ saveSyncedAdded(); saveAddedMeta(addedMeta); }
    }
    render();
  }, onErr);
}

/* ---- Self-heal: reconcile local state with Firestore ----
   Runs after each snapshot arrives. Anything saved on this phone
   that never reached Firestore (a write that failed silently on an
   older version, or an op queued while offline) is queued again —
   the earlier "testing cat" / "checking" adds sync by themselves
   on the next load, with no need to re-add them. This pass only
   ever QUEUES local changes; it never deletes or overwrites
   server state. */
function reconcileLocalWithServer(){
  if(!fbReady) return;
  const queued = loadPending();
  const isQueued = (kind, id)=>queued.some(o=>o.kind===kind && o.id===id);
  if(fbSnapshotsLoaded.added){
    for(const a of addedMeta){
      if(syncedAdded.has(a.id)) continue;
      if(fbAdded[a.id]){ syncedAdded.add(a.id); saveSyncedAdded(); continue; } // already on the server
      if(!isQueued("add", a.id)) queueOp({kind:"add", id:a.id, name:a.name, type:a.type});
    }
  }
  if(fbSnapshotsLoaded.overrides){
    for(const id of Object.keys(overrides)){
      if(fbOverrides[id] === overrides[id]) continue; // server already has this rename
      if(!isQueued("rename", id)) queueOp({kind:"rename", id, name:overrides[id]});
    }
  }
  if(fbSnapshotsLoaded.deleted){
    for(const id of deletedIds){
      if(fbDeleted.has(id)) continue; // server already has this delete
      if(!isQueued("delete", id)) queueOp({kind:"delete", id});
    }
  }
  updateSyncStatus();
  flushPending();
}

/* ---- Firebase init: load SDK on demand, sign in anonymously ----
   The SDK comes from Google's CDN. If it cannot load (offline, or
   the first visit happens with no connection), the app simply runs
   local-only and retries when the browser comes back online. */
/* ---- App version + live sync status line (header) ----
   Shows which version is actually running on this phone, so a stale
   cached page can never be mistaken for the latest one. */
const APP_VERSION = "v10";
const syncStatusEl = document.getElementById("syncStatus");
let syncBaseState = "Connecting…"; // Connected | Local only | Connecting…
let lastSyncError = "";            // short message of the last failed write ("" = none)
function shortErr(e){
  const m = String((e && e.message) || e || "sync failed").replace(/^FirebaseError:\s*/, "").trim();
  return m.slice(0, 48);
}
function updateSyncStatus(){
  if(!syncStatusEl) return;
  let s = lastSyncError ? "Error — " + lastSyncError : syncBaseState;
  const n = loadPending().length;
  if(n > 0) s += " • " + n + " pending";
  syncStatusEl.textContent = APP_VERSION + " • Sync: " + s;
}
function setSyncStatus(state){
  syncBaseState = state;
  if(state === "Connected") lastSyncError = "";
  updateSyncStatus();
}
function setSyncError(e){ lastSyncError = shortErr(e); updateSyncStatus(); }
function clearSyncError(){ if(lastSyncError){ lastSyncError = ""; updateSyncStatus(); } }
async function initFirebase(){
  if(!FIREBASE_CONFIG || fbInitStarted) return;
  fbInitStarted = true;
  try{
    const [appMod, authMod, fsMod] = await Promise.all([
      import(FB_SDK + "firebase-app.js"),
      import(FB_SDK + "firebase-auth.js"),
      import(FB_SDK + "firebase-firestore.js")
    ]);
    if(!fbApp){
      try{ fbApp = appMod.initializeApp(FIREBASE_CONFIG); }
      catch(e){ fbApp = appMod.getApp(); } // already initialized (retry after a partial failure)
    }
    const auth = authMod.getAuth(fbApp);
    let db;
    try{
      db = fsMod.initializeFirestore(fbApp, {localCache: fsMod.persistentLocalCache({})});
    }catch(e){
      db = fsMod.getFirestore(fbApp); // persistent cache unavailable — in-memory cache instead
    }
    fb = {app: fbApp, auth, db,
      doc: fsMod.doc, collection: fsMod.collection, setDoc: fsMod.setDoc, deleteDoc: fsMod.deleteDoc,
      onSnapshot: fsMod.onSnapshot, serverTimestamp: fsMod.serverTimestamp,
      signInAnonymously: authMod.signInAnonymously};
    authMod.onAuthStateChanged(auth, (user)=>{
      if(user){ fbReady = true; setSyncStatus("Connected"); attachListeners(); flushPending(); }
      else{ tryAuth(); }
    });
  }catch(e){
    fb = null; fbReady = false; fbInitStarted = false; // allow retry on next 'online'
    setSyncStatus("Local only"); // SDK could not load — running from local state only
  }
}
async function tryAuth(){
  if(!fb || fbReady) return;
  try{ await fb.signInAnonymously(fb.auth); }
  catch(e){ setSyncStatus("Local only"); /* offline — retried on 'online' */ }
}
window.addEventListener("online", ()=>{ if(!fbReady) setSyncStatus("Connecting…"); initFirebase(); tryAuth(); attachListeners(); flushPending(); });

/* ---- Storage ----
   Names (incl. renames) live in localStorage.
   Added designs' media blobs live in IndexedDB (on-device, offline) —
   localStorage cannot hold photos/videos (5 MB limit), so blobs go to
   IndexedDB while their names/metadata stay in localStorage. */
const LS_NAMES = "alghuse_name_overrides";
const LS_ADDED = "alghuse_added_designs"; // metadata only: [{id,name,type}]
const LS_DELETED = "alghuse_deleted_designs"; // ids of built-in designs the user deleted
const DB_NAME = "alghuse_tailor";
const DB_STORE = "media";

function loadOverrides(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_NAMES)||"{}");
    if(!raw || typeof raw!=="object" || Array.isArray(raw)) return {};
    const clean = {};
    for(const k of Object.keys(raw)){ if(typeof raw[k]==="string") clean[k] = raw[k]; }
    return clean;
  }catch(e){ return {}; }
}
function saveOverrides(o){ localStorage.setItem(LS_NAMES, JSON.stringify(o)); }
function loadDeleted(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_DELETED)||"[]");
    if(!Array.isArray(raw)) return new Set();
    /* Only ids that exist in the built-in catalog may hide a design —
       stale/unknown ids saved by older versions are dropped, never fatal. */
    const known = new Set(DESIGNS.map(d=>d.id));
    return new Set(raw.filter(id=>typeof id==="string" && known.has(id)));
  }catch(e){ return new Set(); }
}
function saveDeleted(s){ localStorage.setItem(LS_DELETED, JSON.stringify([...s])); }
function loadAddedMeta(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_ADDED)||"[]");
    if(!Array.isArray(raw)) return [];
    return raw.filter(a=>a && typeof a.id==="string" && typeof a.name==="string" && (a.type==="image"||a.type==="video"));
  }catch(e){ return []; }
}
function saveAddedMeta(a){ localStorage.setItem(LS_ADDED, JSON.stringify(a)); }

function openDB(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
function dbPut(id, blob){
  return openDB().then(db=>new Promise((res, rej)=>{
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(blob, id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  }));
}
function dbGet(id){
  return openDB().then(db=>new Promise((res, rej)=>{
    const req = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(id);
    req.onsuccess = ()=>res(req.result||null);
    req.onerror = ()=>rej(req.error);
  }));
}
function dbDelete(id){
  return openDB().then(db=>new Promise((res, rej)=>{
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  }));
}

/* ---- State ---- */
const overrides = loadOverrides();
const deletedIds = loadDeleted();
let addedMeta = loadAddedMeta();
let addedUrls = {}; // id -> object URL
let current = null; // design shown in detail view

/* Firestore wins for renames; deletes are a union of local + remote. */
function displayName(d){ return fbOverrides[d.id] || overrides[d.id] || d.name; }
function isDeleted(id){ return deletedIds.has(id) || fbDeleted.has(id); }

async function allDesigns(){
  const list = DESIGNS.filter(d=>!isDeleted(d.id)).map(d=>({...d, name:displayName(d)}));
  const listed = new Set();
  const stale = [];
  for(const a of addedMeta){
    if(!addedUrls[a.id]){
      let blob = null, dbOk = true;
      try{ blob = await dbGet(a.id); }catch(e){ dbOk = false; }
      if(blob) addedUrls[a.id] = URL.createObjectURL(blob);
      else if(dbOk) stale.push(a.id); // metadata saved but media gone — drop the stale entry
      // if IndexedDB itself failed, keep the metadata and just skip it this render
    }
    if(addedUrls[a.id]){ listed.add(a.id); list.push({id:a.id, name:displayName(a), file:addedUrls[a.id], type:a.type, added:true}); }
  }
  if(stale.length){
    /* A stale local entry whose synced copy still exists in Firestore
       is listed below from the remote copy instead. */
    addedMeta = addedMeta.filter(a=>!stale.includes(a.id));
    saveAddedMeta(addedMeta);
  }
  /* Added designs from other phones (Firestore). Local copies — same
     id, with the full-quality blob — are already listed above. */
  for(const id of Object.keys(fbAdded)){
    if(listed.has(id)) continue;
    const r = fbAdded[id];
    if(!r || (r.type!=="image" && r.type!=="video")) continue;
    if(r.type==="image"){
      if(!r.imageData) continue; // photo not synced yet (still uploading on the other phone)
      list.push({id, name:displayName({id, name:r.name}), file:r.imageData, type:"image", added:true, remote:true});
    }else{
      list.push({id, name:displayName({id, name:r.name}), file:null, poster:r.posterData||null, type:"video", added:true, remote:true, videoRemote:true});
    }
  }
  return list;
}

/* Grid thumbnails: built-in photos show a small 440px thumb (the full
   file loads only in detail view). A failed thumb falls back to the
   full file, so the grid never shows a broken image. */
function thumbFor(d){
  if(d.added || d.type!=="image") return d.file;
  return "media/thumbs/" + d.file.split("/").pop();
}

/* ---- Render ---- */
const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearSearch");

let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;
  const q = searchInput.value.trim().toLowerCase();
  const list = await allDesigns();
  if(seq !== renderSeq) return; // a newer render (search/delete/add) superseded this one
  const shown = q ? list.filter(d=>d.name.toLowerCase().includes(q)) : list;
  countEl.textContent = shown.length + " design" + (shown.length===1?"":"s") + (q ? " matching “" + searchInput.value.trim() + "”" : " · tap a design to view");
  grid.innerHTML = "";
  if(!shown.length){
    grid.innerHTML = '<div class="empty">No designs found for “' + escapeHtml(searchInput.value.trim()) + '”.<br>Try another word.</div>';
    return;
  }
  for(const d of shown){
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    let media;
    if(d.type==="video"){
      if(d.poster) media = '<img src="'+d.poster+'" alt="'+escapeHtml(d.name)+'" loading="lazy">';
      else if(d.file) media = '<video src="'+d.file+'" muted playsinline preload="metadata"></video>';
      else media = '<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:180px;background:#1f2937;color:#fff;font-size:42px;">&#9654;</div>';
      media += '<span class="video-badge">&#9654; Video</span>';
    }else{
      media = '<img src="'+thumbFor(d)+'" data-full="'+d.file+'" alt="'+escapeHtml(d.name)+'" loading="lazy" onerror="this.onerror=null;this.src=this.dataset.full;">';
    }
    const note = d.videoRemote ? "<small>Phone-only video</small>" : (d.note ? "<small>"+escapeHtml(d.note)+"</small>" : "");
    card.innerHTML = '<div class="thumb">'+media+'</div><div class="card-name">'+escapeHtml(d.name)+note+'</div>';
    card.addEventListener("click", ()=>openDetail(d));
    card.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDetail(d); } });
    grid.appendChild(card);
  }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  deleteConfirm.style.display = "block";

  deleteConfirm.style.display = "none";
  deleteBtn.style.display = "block";
});
document.getElementById("confirmDelete").addEventListener("click", async ()=>{
  if(!current) return;
  const id = current.id;
  if(current.added){
    addedMeta = addedMeta.filter(a=>a.id!==id);
    saveAddedMeta(addedMeta);
    if(addedUrls[id]){ URL.revokeObjectURL(addedUrls[id]); delete addedUrls[id]; }
    try{ await dbDelete(id); }catch(e){ /* blob already gone */ }
    syncDeleteAdded(id);
  }else{
    deletedIds.add(id);
    saveDeleted(deletedIds);
    syncDelete(id);
  }
  delete overrides[id];
  saveOverrides(overrides);
  syncDeleteOverride(id);
  closeDetail();
  await render();
  showToast("Design deleted");
});

  }
  addedMeta.push({id:id, name:name, type:type});
  saveAddedMeta(addedMeta);
  syncAddDesign(id, name, type, pickedFile);
  closeSheet();
  await render();
  showToast("Design saved");
});

/* ---- Toast ---- */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display = "none"; }, 2200);
}

/* ---- Service worker (offline-first) ---- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* offline still works from cache on next visit */ });
  });
}

/* ---- Offline readiness indicator ----
   The service worker caches the 41 full files (videos first) in the
   background. This line shows the progress and turns into
   "Offline ready" once every file is cached, so it is safe to go
   offline. The page also asks the worker to (re)start the fill on
   every load, so an interrupted fill always resumes. */
const SW_CACHE = "alghuse-v10"; // keep in sync with sw.js CACHE
const FULL_FILES = DESIGNS.map(d=>d.file);
const offlineStatusEl = document.getElementById("offlineStatus");
let offlineReady = false;
function setOfflineStatus(done, total){
  if(!offlineStatusEl) return;
  if(done < 0){ offlineStatusEl.style.display = "none"; return; }
  offlineStatusEl.style.display = "block";
  if(done >= total){
    offlineStatusEl.textContent = "Offline ready ✓ — videos play offline";
    offlineStatusEl.classList.add("ready");
    offlineReady = true;
  }else{
    offlineStatusEl.textContent = "Preparing offline… " + done + "/" + total;
    offlineStatusEl.classList.remove("ready");
  }
}
async function checkOfflineCache(){
  if(!("caches" in window)){ setOfflineStatus(-1, 0); return -1; }
  try{
    const c = await caches.open(SW_CACHE);
    let n = 0;
    for(const f of FULL_FILES){ if(await c.match(f, {ignoreSearch:true})) n++; }
    setOfflineStatus(n, FULL_FILES.length);
    return n;
  }catch(e){ setOfflineStatus(-1, 0); return -1; }
}
function triggerFill(){
  try{
    const ctrl = navigator.serviceWorker.controller;
    if(ctrl){ ctrl.postMessage({type:"FILL_MEDIA"}); return; }
    navigator.serviceWorker.ready.then(reg=>{
      const sw = (reg && reg.active) || navigator.serviceWorker.controller;
      if(sw) sw.postMessage({type:"FILL_MEDIA"});
    }).catch(()=>{});
  }catch(e){}
}
if("serviceWorker" in navigator && "caches" in window){
  navigator.serviceWorker.addEventListener("message", e=>{
    const d = e.data || {};
    if(d.type === "FILL_PROGRESS" || d.type === "FILL_DONE"){
      setOfflineStatus(d.done, d.total);
    }
  });
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ triggerFill(); checkOfflineCache(); });
  triggerFill();
  checkOfflineCache();
  const offlineTimer = setInterval(async ()=>{
    if(offlineReady){ clearInterval(offlineTimer); return; }
    triggerFill(); // re-ask every 2s: an interrupted fill resumes instead of stalling
    await checkOfflineCache();
  }, 2000);
}else if(offlineStatusEl){ offlineStatusEl.style.display = "none"; }

render();
initFirebase(); // starts anonymous sign-in + Firestore sync in the background (local-first if it fails)
/* Retry queued writes every 30s while connected — a write that fails
   once (flaky network, a slow image prepare) is retried on its own
   instead of waiting for the next reload or 'online' event. */
let flushTimerStarted = false;
function startFlushTimer(){
  if(flushTimerStarted) return;
  flushTimerStarted = true;
  setInterval(()=>{ if(fbReady) flushPending(); updateSyncStatus(); }, 30000);
}
startFlushTimer();
</script>
